[project]
name = "aiai"
version = "0.1.0"
description = "CCA-F learning path — Claude Certified Architect Foundations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cca_common"]

[tool.uv]
package = true
